# Continuous Delivery pipeline (deploys to Docker Hub):
# test -> build -> security scan -> push -> staging tag -> (manual approval) -> production tag
#
# Every build is pushed as <user>/cicd-demo:<commit-sha> (immutable).
# "Deploying" to an environment = moving that environment's tag to the image:
#   staging    -> :staging
#   production -> :prod and :latest   (after manual approval)
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
      - run: dotnet restore
      - run: dotnet test -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build locally first (do not push yet) so we can scan before publishing.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security gate: the pipeline fails on HIGH or CRITICAL vulnerabilities.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image to Docker Hub
        run: docker push "$IMAGE:${GITHUB_SHA}"

  deploy-staging:
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Point :staging at this build
        run: docker buildx imagetools create -t "$IMAGE:staging" "$IMAGE:${GITHUB_SHA}"

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Configure "Required reviewers" on this environment in the repo settings.
    # The job pauses here until someone approves (Continuous Delivery).
    environment: production
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Point :prod and :latest at this build
        run: |
          docker buildx imagetools create -t "$IMAGE:prod" -t "$IMAGE:latest" "$IMAGE:${GITHUB_SHA}"
