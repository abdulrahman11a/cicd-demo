# Manual rollback: point :prod / :latest back to any previously built commit.
# Actions tab > "Rollback" > Run workflow > enter a full commit SHA.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA of the image to restore (must already exist on Docker Hub)"
        required: true

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Restore :prod and :latest
        run: |
          docker buildx imagetools create -t "$IMAGE:prod" -t "$IMAGE:latest" "$IMAGE:${{ inputs.sha }}"
